services:
  birdsense:
    build:
      context: .
      dockerfile: Dockerfile
      # The Dockerfile's last stage, `analyzer`: the app on the BirdNET runtime,
      # built in the same build, so this one container serves the site and
      # runs analysis in its own process.
    # The host port is assigned by the environment; the container always
    # listens on 8080.
    ports:
      - "${HOST_PORT}:8080"
    environment:
      BIRDSENSE_ADDR: ":8080"
      BIRDSENSE_STATIC_DIR: "/app/frontend"
      # Local development uses the JSON file backend. Azure runs the default,
      # Cosmos DB -- see DEPLOYMENT.md.
      BIRDSENSE_DB: "local"
      BIRDSENSE_LOCAL_DB_PATH: "/app/data/birdsense.json"
      # Card audio goes to a directory in its own volume. Azure uses Blob
      # Storage -- see DEPLOYMENT.md.
      BIRDSENSE_STORAGE: "local"
      BIRDSENSE_STORAGE_DIR: "/app/audio"
      # A card's original recordings are removed this long after the card is
      # received, once BirdNET has finished with it; its detections and their
      # clips are kept. 0 keeps the originals, which is what a demo container
      # that is left running for months wants.
      BIRDSENSE_AUDIO_RETENTION_DAYS: "30"
      # Perch as a second model after BirdNET (DEPLOYMENT.md, Perch). Its
      # process tree peaks near 2.5 GB, so give Docker the memory first.
      BIRDSENSE_PERCH: "off"
      # Dev mode signs in from the roster picker, so no identity provider is
      # needed. To try the real OpenID Connect flow here instead, fill these in
      # and register http://localhost:${HOST_PORT}/api/v1/auth/microsoft/callback
      # as a redirect URI (providers allow plain http for localhost only).
      # BIRDSENSE_PUBLIC_URL: "http://localhost:${HOST_PORT}"
      # BIRDSENSE_OIDC_MICROSOFT_CLIENT_ID: ""
      # BIRDSENSE_OIDC_MICROSOFT_CLIENT_SECRET: ""
    volumes:
      - birdsense-data:/app/data
      - birdsense-audio:/app/audio
    # The server runs as `birdsense` (uid 10001), and a named volume is only
    # that user's if the runtime makes it so: Docker copies the image's owner
    # onto an empty volume the first time it is mounted, but Podman can leave
    # a new volume root's, and once a volume has been mounted root-owned
    # nothing changes it back -- so the database can't be written, and
    # deleting the volume doesn't reliably help. So the container starts as
    # root, hands anything in the two volumes that isn't `birdsense`'s to it,
    # and runs the server as `birdsense`, as the image does. Compose only: the
    # image itself never runs as root.
    user: root
    entrypoint:
      - sh
      - -c
      - >-
        find /app/data /app/audio ! -user birdsense -exec chown birdsense:birdsense {} +
        && HOME=/home/birdsense exec setpriv --reuid=birdsense --regid=birdsense --init-groups /app/birdsense
    restart: unless-stopped

volumes:
  birdsense-data:
  birdsense-audio:
